name: Monitor ABECMED

# Roda na infraestrutura do GitHub, não na sua máquina: nada precisa ficar
# ligado, aberto ou instalado. Este repositório é público, então os minutos de
# Actions são ilimitados e gratuitos.
#
# O cron aceita no mínimo 5 minutos, mas não entrega isso: medido neste
# repositório, duas execuções agendadas seguidas saíram às 23:02 e 23:32 — meia
# hora. O agendamento do GitHub é "melhor esforço" e, na prática, é estrangulado.
#
# Por isso o cron aqui não é o relógio da verificação, é só o disparador: cada
# execução fica no ar por ~55 minutos verificando o catálogo a cada 5 e ouvindo
# o Telegram no intervalo (ESCUTA e CICLO, mais abaixo). Assim o intervalo real
# é de 5 minutos mesmo quando o agendador atrasa meia hora.
#
# Para espaçar as consultas (menos carga no servidor da ABECMED), aumente
# ESCUTA: é ele que define o intervalo entre uma verificação e a seguinte.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Mandar a notificação mesmo sem mudança (serve de teste)'
        type: boolean
        default: true

permissions:
  contents: write

# Duas verificações ao mesmo tempo brigariam pelo state.json e comparariam
# contra o catálogo errado.
concurrency:
  group: abecmed-monitor
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          # O passo seguinte empurra o state.json de volta, e o servidor recusa
          # push vindo de clone raso ("shallow update not allowed") — foi o que
          # aconteceu com o workflow de publicação. Daí fetch-depth: 0.
          #
          # Só que um clone completo aqui traria o histórico de builds do jogo
          # (bundles de MBs) a cada 5 minutos. `filter: blob:none` baixa o
          # histórico sem os arquivos, e o sparse-checkout traz para o disco
          # apenas a pasta do monitor.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: abecmed-monitor
          sparse-checkout-cone-mode: true

      - name: Consultar o catálogo e comparar com a consulta anterior
        id: consulta
        env:
          # O CPF nunca aparece no código nem nos logs: vem do Secret e o
          # GitHub mascara o valor automaticamente na saída.
          ABECMED_CPF: ${{ secrets.ABECMED_CPF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Um Secret só, com CPF e token juntos — o monitor separa os dois.
          ABECMED_CONFIG: ${{ secrets.ABECMED_CONFIG }}
          FORCAR: ${{ (github.event_name == 'workflow_dispatch' && inputs.forcar) && '--forcar' || '' }}
          # Quanto tempo a execução fica ouvindo o Telegram entre uma
          # verificação e a seguinte. Somado aos ~10s da consulta, dá o ciclo de
          # ~5 minutos. Não gera requisição a mais para a ABECMED: o long
          # polling dorme esperando mensagem.
          ESCUTA: '285'
          # Quanto tempo a execução fica no ar por disparo. 3300s = 55 min, ou
          # ~12 verificações. Vale saber o que isto é: com o ciclo se
          # reencadeando, o Actions passa a hospedar um processo de plantão, e
          # não a rodar uma tarefa de CI. Para voltar ao modelo de uma
          # verificação por disparo, use CICLO: '0'.
          CICLO: '3300'
        run: |
          set +e
          # O cron do GitHub promete 5 minutos e entrega ~30: medido, duas
          # execuções agendadas seguidas saíram 23:02 e 23:32. Depender dele
          # quebrava as duas promessas — nem verificava de 5 em 5 minutos, nem
          # tinha ninguém escutando o Telegram na hora do toque.
          #
          # Então a execução não faz uma verificação e vai embora: ela fica no
          # ar por uma hora, verificando o catálogo a cada ~5 minutos e ouvindo
          # o Telegram no intervalo. O cron passa a ser só o disparador que
          # recomeça o ciclo, e o grupo de concorrência garante uma execução
          # por vez — a seguinte fica pendente e assume assim que esta termina.
          fim=$(( $(date +%s) + ${CICLO:-3300} ))
          rodadas=0
          while :; do
            restante=$(( fim - $(date +%s) ))
            [ "$restante" -le 30 ] && break
            escuta=${ESCUTA:-285}
            [ "$restante" -lt "$escuta" ] && escuta=$restante
            python3 abecmed-monitor/monitor.py $FORCAR --escutar "$escuta" 2>&1 | tee /tmp/saida.txt
            codigo=${PIPESTATUS[0]}
            rodadas=$(( rodadas + 1 ))
            # --forcar é teste manual: vale para a primeira rodada, não para as
            # doze seguintes, senão viraria uma notificação a cada 5 minutos.
            FORCAR=''
            # Erro de configuração não melhora repetindo por uma hora.
            [ "$codigo" = "2" ] && break
            # O ciclo dura ~55 min, então código novo só valia na hora seguinte:
            # foi assim que um botão recém-criado ficou mudo para quem o tocava,
            # porque a execução no ar era anterior ao deploy. Ao ver a branch
            # andar, este ciclo encerra e a execução pendente assume com o
            # código atual.
            if git fetch -q origin "${{ github.ref_name }}" 2>/dev/null &&
               [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
              echo "Código novo na branch — encerrando para a próxima execução assumir."
              break
            fi
          done
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          echo "Ciclo encerrado após $rodadas verificação(ões)."
          {
            echo '### Verificação da ABECMED'
            echo ''
            echo '```'
            cat /tmp/saida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Guardar o catálogo desta verificação
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add abecmed-monitor/state.json
          if git diff --cached --quiet; then
            echo 'Catálogo idêntico ao da consulta anterior — nada a guardar.'
            exit 0
          fi
          git commit -m "ABECMED: catálogo de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          # A publicação do site também empurra para a main; se as duas caírem
          # na mesma janela, rebase e tenta de novo em vez de perder a consulta.
          for tentativa in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            echo "push falhou (tentativa $tentativa), rebaseando..."
            git pull --rebase origin ${{ github.ref_name }} || git rebase --abort
            sleep $((tentativa * 3))
          done
          echo '::error::não consegui guardar o state.json depois de 5 tentativas'
          exit 1

      - name: Concluir
        run: |
          codigo='${{ steps.consulta.outputs.codigo }}'
          case "$codigo" in
            0)
              echo 'Verificação concluída.'
              ;;
            2)
              echo '::warning::O Secret ABECMED_CPF ainda não foi configurado — o monitor está parado. Configure em Settings > Secrets and variables > Actions.'
              ;;
            3)
              echo '::error::Havia mudança para avisar, mas nenhum canal de notificação funcionou. Confira o Secret TELEGRAM_BOT_TOKEN e se você já tocou em INICIAR no bot.'
              exit 1
              ;;
            *)
              # Uma falha isolada (instabilidade do site, timeout) não deixa o
              # workflow vermelho: seria e-mail a cada 5 minutos. O próprio
              # monitor avisa no celular quando falha 6 vezes seguidas.
              falhas=$(python3 -c "import json;print(json.load(open('abecmed-monitor/state.json')).get('falhas_seguidas',0))" 2>/dev/null || echo 0)
              echo "::warning::Consulta falhou ($falhas seguidas). Detalhes no passo anterior."
              if [ "$falhas" -ge 6 ]; then
                echo '::error::O monitor falhou 6 vezes seguidas — algo mudou no site da ABECMED.'
                exit 1
              fi
              ;;
          esac
