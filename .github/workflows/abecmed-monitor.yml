name: Monitor ABECMED

# Roda na infraestrutura do GitHub, não na sua máquina: nada precisa ficar
# ligado, aberto ou instalado. Este repositório é público, então os minutos de
# Actions são ilimitados e gratuitos.
#
# O cron do GitHub aceita no mínimo 5 minutos e é "melhor esforço": em horário
# de pico a fila às vezes atrasa alguns minutos ou pula uma rodada. Para
# espaçar as consultas (menos carga no servidor da ABECMED), troque o '*/5'
# abaixo por '*/15' ou '*/30' — é a única linha que muda.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Mandar a notificação mesmo sem mudança (serve de teste)'
        type: boolean
        default: true

permissions:
  contents: write

# Duas verificações ao mesmo tempo brigariam pelo state.json e comparariam
# contra o catálogo errado.
concurrency:
  group: abecmed-monitor
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Consultar o catálogo e comparar com a consulta anterior
        id: consulta
        env:
          # O CPF nunca aparece no código nem nos logs: vem do Secret e o
          # GitHub mascara o valor automaticamente na saída.
          ABECMED_CPF: ${{ secrets.ABECMED_CPF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCAR: ${{ (github.event_name == 'workflow_dispatch' && inputs.forcar) && '--forcar' || '' }}
        run: |
          set +e
          python3 abecmed-monitor/monitor.py $FORCAR 2>&1 | tee /tmp/saida.txt
          codigo=${PIPESTATUS[0]}
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          {
            echo '### Verificação da ABECMED'
            echo ''
            echo '```'
            cat /tmp/saida.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Guardar o catálogo desta verificação
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add abecmed-monitor/state.json
          if git diff --cached --quiet; then
            echo 'Catálogo idêntico ao da consulta anterior — nada a guardar.'
            exit 0
          fi
          git commit -m "ABECMED: catálogo de $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          # A publicação do site também empurra para a main; se as duas caírem
          # na mesma janela, rebase e tenta de novo em vez de perder a consulta.
          for tentativa in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            echo "push falhou (tentativa $tentativa), rebaseando..."
            git pull --rebase origin ${{ github.ref_name }} || git rebase --abort
            sleep $((tentativa * 3))
          done
          echo '::error::não consegui guardar o state.json depois de 5 tentativas'
          exit 1

      - name: Concluir
        run: |
          codigo='${{ steps.consulta.outputs.codigo }}'
          case "$codigo" in
            0)
              echo 'Verificação concluída.'
              ;;
            2)
              echo '::warning::O Secret ABECMED_CPF ainda não foi configurado — o monitor está parado. Configure em Settings > Secrets and variables > Actions.'
              ;;
            3)
              echo '::error::Havia mudança para avisar, mas nenhum canal de notificação funcionou. Confira o Secret TELEGRAM_BOT_TOKEN e se você já tocou em INICIAR no bot.'
              exit 1
              ;;
            *)
              # Uma falha isolada (instabilidade do site, timeout) não deixa o
              # workflow vermelho: seria e-mail a cada 5 minutos. O próprio
              # monitor avisa no celular quando falha 6 vezes seguidas.
              falhas=$(python3 -c "import json;print(json.load(open('abecmed-monitor/state.json')).get('falhas_seguidas',0))" 2>/dev/null || echo 0)
              echo "::warning::Consulta falhou ($falhas seguidas). Detalhes no passo anterior."
              if [ "$falhas" -ge 6 ]; then
                echo '::error::O monitor falhou 6 vezes seguidas — algo mudou no site da ABECMED.'
                exit 1
              fi
              ;;
          esac
