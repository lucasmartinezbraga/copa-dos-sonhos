name: Auditoria 650 — aplicar e validar fixpack

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: audit650-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-audit:
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout da branch candidata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          show-progress: false

      - name: Identidade antes da alteração
        run: |
          sha256sum "dist/COPA DOS SONHOS - RC-UX.html"
          git rev-parse HEAD

      - name: Aplicar correções da auditoria 650
        id: patch
        continue-on-error: true
        run: |
          mkdir -p reports
          set +e
          python3 tools/audit650/apply_fixpack_v2.py > reports/AUDITORIA-650-PATCH-DIAGNOSTICO.txt 2>&1
          status=$?
          if [ $status -eq 0 ]; then
            python3 tools/audit650/apply_followup.py >> reports/AUDITORIA-650-PATCH-DIAGNOSTICO.txt 2>&1
            status=$?
          fi
          if [ $status -ne 0 ]; then
            echo "" >> reports/AUDITORIA-650-PATCH-DIAGNOSTICO.txt
            echo "--- contagem de padrões ---" >> reports/AUDITORIA-650-PATCH-DIAGNOSTICO.txt
            python3 - <<'PY' >> reports/AUDITORIA-650-PATCH-DIAGNOSTICO.txt
          from pathlib import Path
          t=Path('dist/COPA DOS SONHOS - RC-UX.html').read_text(encoding='utf-8')
          pats={
            'fixpack_marker':'AUDIT650-RCUX-FIXPACK-2',
            'followup_marker':'AUDIT650-RCUX-FOLLOWUP-1',
            'fixed_pulse':'performance.now() / 130',
            'speed_pulse':'130 * visualSpeed',
            'geometry_start':'const G = {',
            'topY':'G.topY = M + 34;',
            'dirCache':'  const dirCache = new Map();',
            'ballLift':'const bx = g0.x, by = g0.y - z * 22 * s;',
            'trailLift':'p.y - (tp.z || 0) * 22 * p.s',
            'guideLift':'g.y - z * 22 * g.s',
            'aerial':'const aerial = !isShot && z > 0.45;',
            'stage':'spPerspective',
            'bodyClose':'</body>'
          }
          for k,v in pats.items(): print(k,t.count(v))
          PY
          fi
          cat reports/AUDITORIA-650-PATCH-DIAGNOSTICO.txt
          exit $status

      - name: Publicar diagnóstico do aplicador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit650-patch-diagnostico-${{ github.run_number }}
          path: reports/AUDITORIA-650-PATCH-DIAGNOSTICO.txt
          retention-days: 7

      - name: Interromper após recusa segura
        if: steps.patch.outcome == 'failure'
        run: exit 1

      - name: Validar bloqueadores por inspeção estática
        id: static
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m py_compile tools/audit650/apply_fixpack_v2.py tools/audit650/apply_followup.py tools/audit650/static_verify.py
          python3 tools/audit650/static_verify.py
          node --check tools/ux/audit_match.js

      - name: Publicar relatório estático
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit650-static-${{ github.run_number }}
          path: reports/AUDITORIA-650-STATIC-VERIFY.json
          retention-days: 7

      - name: Interromper após falha estática
        if: steps.static.outcome == 'failure'
        run: exit 1

      - name: Instalar Chromium de auditoria
        if: steps.patch.outcome == 'success' && steps.static.outcome == 'success'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Executar partidas em navegador real
        if: steps.patch.outcome == 'success' && steps.static.outcome == 'success'
        run: |
          export CDS_CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node tools/ux/audit_match.js \
            --build="dist/COPA DOS SONHOS - RC-UX.html" \
            --matches=2 \
            --label=audit650 \
            --out=reports/ux/audit-match-audit650

      - name: Gate dinâmico duro
        if: steps.patch.outcome == 'success' && steps.static.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('reports/ux/audit-match-audit650/match-audit.json').read_text())
          failures=[]
          if data.get('errors'): failures.append(f"page/console errors={data['errors']}")
          for m in data.get('matches',[]):
              i=m.get('index'); inv=m.get('invariants') or {}; end=m.get('end') or {}
              if not end.get('over'): failures.append(f'match {i}: did not finish')
              if end.get('canonical')!='CONSISTENT': failures.append(f"match {i}: canonical={end.get('canonical')}")
              if inv.get('ballAboveStands',0)!=0: failures.append(f"match {i}: ballAboveStands={inv.get('ballAboveStands')}")
              if inv.get('nonFiniteVisual',0)!=0: failures.append(f"match {i}: nonFiniteVisual={inv.get('nonFiniteVisual')}")
              if any(not g.get('sync') for g in inv.get('goalChecks',[])): failures.append(f'match {i}: score DOM mismatch')
              hard=end.get('hard') or {}
              for k in ('ballTeleports','playerTeleports','nonFinite','ownerNoContact','invalidTimelines'):
                  if hard.get(k,0)!=0: failures.append(f'match {i}: {k}={hard.get(k)}')
          if failures: raise SystemExit('\n'.join(failures))
          print(json.dumps({'verdict':'PASS_DYNAMIC_FIXPACK','matches':len(data.get('matches',[]))},ensure_ascii=False))
          PY

      - name: Consolidar evidência e hash final
        if: steps.patch.outcome == 'success' && steps.static.outcome == 'success'
        run: |
          sha256sum "dist/COPA DOS SONHOS - RC-UX.html" | tee reports/AUDITORIA-650-FINAL-SHA256.txt
          git status --short

      - name: Publicar resultado na branch
        if: steps.patch.outcome == 'success' && steps.static.outcome == 'success'
        run: |
          git config user.name "audit650-bot"
          git config user.email "audit650-bot@users.noreply.github.com"
          git add "dist/COPA DOS SONHOS - RC-UX.html" reports tools/ux/audit_match.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nova para publicar."
          else
            git commit -m "fix: fecha bloqueadores da auditoria 650 [audit650-applied]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Anexar evidências da execução
        if: steps.patch.outcome == 'success' && steps.static.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-650-evidencias
          path: |
            reports/AUDITORIA-650-*.json
            reports/AUDITORIA-650-FINAL-SHA256.txt
            reports/ux/audit-match-audit650/
          retention-days: 30
