name: Export correction source

on:
  pull_request:
    branches:
      - agent/fase-9-ia-treinador
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/correcao-auditoria-fases-0-9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/correcao-auditoria-fases-0-9
          fetch-depth: 0
      - name: Empacotar fonte
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.github/workflows/export-correction-source.yml -czf /tmp/copa-correction-source.tar.gz .
          sha256sum /tmp/copa-correction-source.tar.gz > /tmp/copa-correction-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: correction-source
          path: |
            /tmp/copa-correction-source.tar.gz
            /tmp/copa-correction-source.sha256
          if-no-files-found: error
          retention-days: 1
