name: Export repository snapshot

on:
  push:
    branches:
      - agent/fases-4-7-final
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package repository
        run: zip -r copa-dos-sonhos-source.zip . -x '.git/*' 'copa-dos-sonhos-source.zip'
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: copa-dos-sonhos-source
          path: copa-dos-sonhos-source.zip
          retention-days: 1
