name: Finalizar Fase 8

on:
  pull_request:
    branches:
      - agent/fases-4-7-final
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fase-8-goleiros-bolas-paradas
          fetch-depth: 0

      - name: Aplicar pacote da Fase 8
        shell: bash
        run: |
          set -euo pipefail
          cat .phase8_patch/part-* > /tmp/phase8.patch.gz.b64
          base64 -d /tmp/phase8.patch.gz.b64 > /tmp/phase8.patch.gz
          gzip -dc /tmp/phase8.patch.gz > /tmp/phase8.patch
          git apply --index /tmp/phase8.patch

      - name: Validar e gerar build 5.1.0
        shell: bash
        run: |
          set -euo pipefail
          node tests/phase8_gk_saves.js
          node tests/phase8_goalkeepers_setpieces.js
          node tests/phase8_penalty_shootout.js
          CDS_LAB_PHASE47=1 CDS_LAB_PHASE8=1 node tests/phase8_live_match.js
          python3 tools/build_phase8.py
          python3 tools/verify.py

      - name: Publicar entrega limpa
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .phase8_patch .github/workflows/phase8-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fase 8: conclui goleiros e bolas paradas — v5.1.0'
          git push origin HEAD:agent/fase-8-goleiros-bolas-paradas
