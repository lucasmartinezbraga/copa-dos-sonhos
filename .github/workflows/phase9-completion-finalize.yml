name: Exportar Fase 9 para correção

on:
  pull_request:
    branches:
      - agent/fase-8-goleiros-bolas-paradas
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/fase-9-ia-treinador' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fase-9-ia-treinador
          fetch-depth: 0

      - name: Preparar pacote de depuração
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase9-export
          tr -d '\r\n ' < .phase9_completion/phase9-v521.patch.gz.b64 | base64 -d > /tmp/phase9-export/phase9-v521.patch.gz
          gzip -dc /tmp/phase9-export/phase9-v521.patch.gz > /tmp/phase9-export/phase9-v521.patch
          tar --exclude=.git --exclude=.phase9_completion --exclude=.github/workflows/phase9-completion-finalize.yml -czf /tmp/phase9-export/phase9-branch-v520.tar.gz .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase9-debug-export
          path: /tmp/phase9-export
          if-no-files-found: error
          retention-days: 2
