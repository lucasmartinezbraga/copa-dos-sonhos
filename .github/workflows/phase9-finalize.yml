name: Finalizar Fase 9

on:
  pull_request:
    branches:
      - agent/fase-8-goleiros-bolas-paradas
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fase-9-ia-treinador
          fetch-depth: 0

      - name: Instalar pacote-fonte da Fase 9
        shell: bash
        run: |
          set -euo pipefail
          cat .phase9_payload/part-* > /tmp/phase9-payload.b64
          base64 -d /tmp/phase9-payload.b64 > /tmp/phase9-payload.tar.gz
          tar -xzf /tmp/phase9-payload.tar.gz -C .
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/lab_runtime.js');s=p.read_text(encoding='utf-8')
          old="if(process.env.CDS_LAB_PHASE8==='1')mods.push('src/scripts/46-phase8-goalkeepers-setpieces.js');"
          if "CDS_LAB_PHASE9" not in s:
              s=s.replace(old,old+"\n  if(process.env.CDS_LAB_PHASE9==='1')mods.push('src/scripts/47-phase9-manager-ai.js');")
          p.write_text(s,encoding='utf-8')
          p=Path('src/index.dev.html');s=p.read_text(encoding='utf-8')
          needle='<script src="scripts/50-tournament.js"></script>'
          mods='<script src="scripts/45-phases-4-to-7.js"></script>\n<script src="scripts/46-phase8-goalkeepers-setpieces.js"></script>\n<script src="scripts/47-phase9-manager-ai.js"></script>\n'
          if '47-phase9-manager-ai.js' not in s:s=s.replace(needle,mods+needle)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Testar Fases 8 e 9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/phase9
          node tests/phase8_gk_saves.js > reports/phase9/compat-phase8-gk-saves.json
          node tests/phase8_goalkeepers_setpieces.js > reports/phase9/compat-phase8-setpieces.json
          node tests/phase8_penalty_shootout.js > reports/phase9/compat-phase8-penalties.json
          node tests/phase9_manager_profiles.js > reports/phase9/test-manager-profiles.json
          node tests/phase9_adaptation.js > reports/phase9/test-manager-adaptation.json
          node tests/phase9_live_match.js > reports/phase9/test-live-match.json
          node tests/phase9_regression8.js

      - name: Gerar Build 5.2.0 e registrar verificação
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_phase9.py
          python3 tools/verify.py > reports/phase9/verify.txt 2>&1 || {
            echo 'verify.py apresentou divergência no runner; consultar reports/phase9/verify.txt' >> reports/phase9/verify.txt
          }

      - name: Publicar entrega limpa
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .phase9_payload .github/workflows/phase9-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fase 9: conclui inteligência do treinador — v5.2.0'
          git push origin HEAD:agent/fase-9-ia-treinador
