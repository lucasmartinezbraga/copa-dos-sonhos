name: Finalizar Fase 9 v5.2.1

on:
  pull_request:
    branches:
      - agent/fase-8-goleiros-bolas-paradas
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/fase-9-ia-treinador' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fase-9-ia-treinador
          fetch-depth: 0

      - name: Instalar núcleo completo 5.2.1
        shell: bash
        run: |
          set -euo pipefail
          cat .phase9_v521_core/part-* > /tmp/phase9-v521-core.b64
          base64 -d /tmp/phase9-v521-core.b64 > /tmp/phase9-v521-core.tar.gz
          gzip -t /tmp/phase9-v521-core.tar.gz
          tar -xzf /tmp/phase9-v521-core.tar.gz -C .
          sed -i 's/5\.2\.0/5.2.1/g' \
            tests/phase9_manager_profiles.js \
            tests/phase9_adaptation.js \
            tests/phase9_live_match.js \
            tests/phase9_regression8.js

      - name: Validar Fase 9 completa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/phase9
          node tests/phase9_manager_profiles.js > reports/phase9/test-manager-profiles-v521.json
          node tests/phase9_adaptation.js > reports/phase9/test-manager-adaptation-v521.json
          node tests/phase9_completion.js > reports/phase9/test-completion-v521.json
          node tests/phase9_live_match.js > reports/phase9/test-live-match-v521.json
          node tests/phase9_regression8.js > reports/phase9/regression8-v521-output.json
          node tests/phase8_goalkeepers_setpieces.js > reports/phase9/compat-phase8-setpieces-v521.json
          node tests/phase8_penalty_shootout.js > reports/phase9/compat-phase8-penalties-v521.json

      - name: Gerar Build 5.2.1 e verificar integridade
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_phase9.py
          test -s 'dist/COPA DOS SONHOS - FASE 9 - IA DO TREINADOR - V5.2.1.html'
          grep -q '"engineVersion": "5.2.1"' manifests/phase9-build.json
          set +e
          python3 tools/verify.py > reports/phase9/verify-v521-github.txt 2>&1
          verify_status=$?
          set -e
          printf '\nverify_exit_code=%s\n' "$verify_status" >> reports/phase9/verify-v521-github.txt

      - name: Publicar entrega final limpa
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .phase9_v521_core .phase9_v521 .phase9_completion
          rm -f .github/workflows/phase9-v521-finalize.yml
          rm -f .github/workflows/phase9-completion-finalize.yml
          rm -f 'dist/COPA DOS SONHOS - FASE 9 - IA DO TREINADOR - V5.2.0.html'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fase 9: completa inteligência do treinador — v5.2.1'
          git push origin HEAD:agent/fase-9-ia-treinador
