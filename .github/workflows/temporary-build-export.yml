name: Finalize phases 4-7 build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/fases-4-7-final' }}
          fetch-depth: 0

      - name: Apply conservative phase 4-7 calibration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/scripts/45-phases-4-to-7.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            "fx.shoot=(base.shoot||1)*(f.earlyShots?1.1:f.workBall?.91:1);":"fx.shoot=(base.shoot||1)*(f.earlyShots?1.04:f.workBall?.96:1);",
            "fx.cross=(base.cross||1)*(f.crossType==='high'?1.12:f.crossType==='cutback'?1.05:1);":"fx.cross=(base.cross||1)*(f.crossType==='high'?1.05:f.crossType==='cutback'?1.02:1);",
            "fx.far=(base.far||1)*(f.longShots==='more'?1.14:1);":"fx.far=(base.far||1)*(f.longShots==='more'?1.06:1);",
            "tm.fx.direct=C(tm.fx.direct+(best.action==='pass_short'?-.1:.12),.05,.98);":"tm.fx.direct=C(tm.fx.direct+(best.action==='pass_short'?-.06:.07),.05,.98);",
            "if(best.action==='dribble'||best.action==='carry')tm.fx.drible*=1.12;if(best.action==='shoot')tm.fx.shoot*=1.12;if(best.action==='cross')tm.fx.cross*=1.12;":"if(best.action==='dribble'||best.action==='carry')tm.fx.drible*=1.06;if(best.action==='shoot')tm.fx.shoot*=1.04;if(best.action==='cross')tm.fx.cross*=1.04;"
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Make smoke test portable
        run: |
          cat > tests/phase47_smoke.js <<'EOF'
          'use strict';
          const assert=require('assert'),fs=require('fs'),path=require('path'),vm=require('vm'),{performance}=require('perf_hooks');
          const ROOT=path.resolve(__dirname,'..');global.window=global;global.performance=performance;global.CanvasRenderingContext2D=undefined;
          window.__cdsDebugWarn=()=>{};window.__cdsDebugLog=()=>{};
          for(const rel of ['src/scripts/00-polyfills.js','src/scripts/10-data.js','src/scripts/20-core.js','src/scripts/25-data-integrity-v3.js','src/scripts/30-tactics.js','src/scripts/40-match-engine-and-manager-ai.js','src/scripts/45-phases-4-to-7.js']) vm.runInThisContext(fs.readFileSync(path.join(ROOT,rel),'utf8'),{filename:rel});
          assert.strictEqual(CDS_PHASES_4_7.installed,true);assert.strictEqual(CDS_PHASES_4_7.VERSION,'5.0.0');
          assert.strictEqual(typeof MatchSim.prototype.setTeamInstructions,'function');assert.strictEqual(typeof MatchSim.prototype.setPlayerPhaseRole,'function');
          const bad=CDS_PHASES_4_7.normalizeInstructions({inPossession:{buildup:{method:'short'},progression:{verticality:90},finalThird:{}},transition:{afterRecovery:'counter'},outOfPossession:{}},'balanced');
          assert(CDS_PHASES_4_7.detectConflicts(bad).some(x=>x.code==='SHORT_COUNTER'));
          console.log('phase47_smoke: OK');
          EOF

      - name: Validate source and engine contracts
        run: |
          node --check src/scripts/45-phases-4-to-7.js
          node tests/phase47_smoke.js
          node tests/phase3_determinism.js
          node tests/phase3_fixed_step.js

      - name: Generate final self-contained HTML
        run: |
          python3 tools/build_phase47.py
          python3 tools/verify.py

      - name: Commit generated build and QA metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scripts/45-phases-4-to-7.js tests/phase47_smoke.js tools/build_phase47.py manifests/phase47-build.json 'dist/COPA DOS SONHOS - BUILD FINAL FASES 4 A 7 - V5.0.0.html'
          if ! git diff --cached --quiet; then
            git commit -m 'Fases 4-7: calibra, testa e gera build final 5.0.0'
            git push origin HEAD:${{ github.event.pull_request.head.ref || 'agent/fases-4-7-final' }}
          fi

      - name: Package final artifacts
        run: |
          mkdir -p phase47-artifact
          cp 'dist/COPA DOS SONHOS - BUILD FINAL FASES 4 A 7 - V5.0.0.html' phase47-artifact/
          cp manifests/phase47-build.json phase47-artifact/
          cp src/scripts/45-phases-4-to-7.js phase47-artifact/
          cp tests/phase47_smoke.js phase47-artifact/
          zip -r copa-dos-sonhos-build-final-v5.zip phase47-artifact

      - name: Upload final build
        uses: actions/upload-artifact@v4
        with:
          name: copa-dos-sonhos-build-final-v5
          path: copa-dos-sonhos-build-final-v5.zip
          retention-days: 7
